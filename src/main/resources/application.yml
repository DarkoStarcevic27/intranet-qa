spring:
  application:
    name: intranet-qa
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intranetqa}
    username: ${DB_USER:intranetqa}
    password: ${DB_PASSWORD:intranetqa}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/intranetqa}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:changeme}
      # Point base-url at a local Ollama instance (http://localhost:11434) to
      # run this without any paid API key; Ollama exposes an OpenAI-compatible
      # endpoint, so no code changes are needed, only config.
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.darko.intranetqa: INFO
    org.springframework.ai: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:intranetqa}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/intranetqa}
