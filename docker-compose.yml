services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: intranetqa
      POSTGRES_USER: intranetqa
      POSTGRES_PASSWORD: intranetqa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intranetqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/intranetqa-realm.json:/opt/keycloak/data/import/intranetqa-realm.json:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: intranetqa
      DB_USER: intranetqa
      DB_PASSWORD: intranetqa
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/intranetqa
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
